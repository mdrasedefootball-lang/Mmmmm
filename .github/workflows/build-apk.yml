name: Build and Publish Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Temurin Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Verify Java environment
        run: |
          java -version
          echo "JAVA_HOME: $JAVA_HOME"
          JAVA_VER=$(java -version 2>&1 | head -n 1 | awk -F '"' '{print $2}')
          echo "Detected Java full version: $JAVA_VER"
          JAVA_MAJOR=$(echo "$JAVA_VER" | cut -d'.' -f1)
          if [ -z "$JAVA_MAJOR" ]; then
            echo "::error::Could not detect Java major version"
            exit 1
          fi
          echo "Active Java major version: $JAVA_MAJOR"
          if [ "$JAVA_MAJOR" -lt 17 ]; then
            echo "::error::Java major version $JAVA_MAJOR is lower than required 17"
            exit 1
          fi
          echo "Java environment verified successfully (version $JAVA_MAJOR >= 17)."

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Create temporary debug keystore
        run: |
          if [ -f "./debug.keystore" ]; then
            echo "./debug.keystore already exists."
          else
            echo "./debug.keystore not found. Generating temporary debug keystore..."
            "$JAVA_HOME/bin/keytool" -genkey -v \
              -keystore ./debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi
          if [ ! -f "./debug.keystore" ]; then
            echo "::error::Failed to create ./debug.keystore"
            exit 1
          fi
          echo "Temporary debug keystore verified."

      - name: Build the debug APK
        run: gradle :app:assembleDebug --stacktrace --no-daemon

      - name: Verify the APK
        run: |
          EXPECTED_APK="app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$EXPECTED_APK" ]; then
            echo "::error::Expected debug APK not found at $EXPECTED_APK"
            echo "Searching only inside app/build/outputs/apk:"
            if [ -d "app/build/outputs/apk" ]; then
              find app/build/outputs/apk -maxdepth 3 -type f -name "*.apk"
            else
              echo "Directory app/build/outputs/apk does not exist."
            fi
            exit 1
          fi
          if [ ! -s "$EXPECTED_APK" ]; then
            echo "::error::Found $EXPECTED_APK but it is an empty file"
            exit 1
          fi
          if [[ "$EXPECTED_APK" != *.apk ]]; then
            echo "::error::$EXPECTED_APK does not have .apk extension"
            exit 1
          fi
          echo "APK verified successfully at $EXPECTED_APK"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_ASSET_DIR=$(mktemp -d)
          REPO_RAW="${{ github.event.repository.name }}"
          if [ -z "$REPO_RAW" ]; then
            REPO_RAW=$(echo "${{ github.repository }}" | cut -d'/' -f2)
          fi
          SAFE_REPO=$(echo "$REPO_RAW" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9_-]/-/g' | sed 's/--*/-/g' | sed 's/^-//;s/-$//')
          if [ -z "$SAFE_REPO" ]; then
            SAFE_REPO="app"
          fi
          RELEASE_FILENAME="${SAFE_REPO}-debug-build-${{ github.run_number }}.apk"
          ASSET_PATH="${TMP_ASSET_DIR}/${RELEASE_FILENAME}"
          cp "app/build/outputs/apk/debug/app-debug.apk" "$ASSET_PATH"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ]; then
            echo "::error::Failed to prepare release asset at $ASSET_PATH"
            exit 1
          fi
          echo "Prepared release asset: $ASSET_PATH"
          echo "asset_path=$ASSET_PATH" >> "$GITHUB_OUTPUT"
          echo "asset_filename=$RELEASE_FILENAME" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          ASSET_PATH="${{ steps.prepare_asset.outputs.asset_path }}"
          if [ ! -f "$ASSET_PATH" ] || [ ! -s "$ASSET_PATH" ] || [[ "$ASSET_PATH" != *.apk ]]; then
            echo "::error::Release asset validation failed: $ASSET_PATH"
            exit 1
          fi
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          RELEASE_TITLE="Debug APK Build #${{ github.run_number }}"
          RELEASE_NOTES=$(cat << 'EOF'
### Automated Debug APK Build
- **Build Type**: Automatically generated debug APK built by GitHub Actions
- **Workflow Run Number**: ${{ github.run_number }}
- **Workflow Run Attempt**: ${{ github.run_attempt }}
- **Source Commit**: ${{ github.sha }}
- **Testing Notice**: This APK is intended for testing purposes. It is not a Play Store production release and is signed only with a temporary debug keystore.
EOF
)

          echo "Publishing release: $TAG_NAME"
          gh release create "$TAG_NAME" "$ASSET_PATH" \
            --target "${{ github.sha }}" \
            --title "$RELEASE_TITLE" \
            --notes "$RELEASE_NOTES" \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG_NAME="debug-apk-build-${{ github.run_number }}-${{ github.run_attempt }}"
          ASSET_FILENAME="${{ steps.prepare_asset.outputs.asset_filename }}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            echo "Publishing succeeded."
            gh release view "$TAG_NAME"
            RELEASE_URL=$(gh release view "$TAG_NAME" --json url -q .url)
            echo "Release Tag: $TAG_NAME"
            echo "Release Title: Debug APK Build #${{ github.run_number }}"
            echo "Release Page URL: $RELEASE_URL"
            echo "Asset Filename: $ASSET_FILENAME"
            {
              echo "### 🚀 APK Published to GitHub Releases"
              echo ""
              echo "- **Release Page**: [$RELEASE_URL]($RELEASE_URL)"
              echo "- **Download APK**: Download \`$ASSET_FILENAME\` directly from the **Assets** section of the release page."
              echo "- **Backup Artifact**: The standard Actions artifact \`app-debug-apk\` is also available from this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::GitHub Release publishing was skipped or encountered an error."
            echo "The APK build succeeded. Actions artifact named 'app-debug-apk' remains available."
            {
              echo "### ⚠️ GitHub Release Publishing Notice"
              echo ""
              echo "The debug APK was built successfully and uploaded as a GitHub Actions artifact (\`app-debug-apk\`)."
              echo "GitHub Release publishing did not complete. You can download the APK from the **Artifacts** section of this workflow run."
            } >> "$GITHUB_STEP_SUMMARY"
          fi
